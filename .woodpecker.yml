when:
  - branch: main
    event: [push, pull_request]

clone:
  git:
    image: alpine/git
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git init
      - git remote add origin "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/androidconnect-rs.git"
      - git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
      - git checkout FETCH_HEAD

steps:
  - name: rust-checks
    image: rust:1.88
    commands:
      - cargo fmt --all -- --check
      - cargo clippy --workspace -- -D warnings
      - cargo test --workspace

  - name: android-build
    image: repo.indexarr.net/indexarr/androidconnect-rs-ci:latest
    commands:
      - ./tools/build-android-native.sh
      - cd apps/android && ./gradlew assembleDebug

  - name: publish-apk
    image: alpine:3.21
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache bash curl >/dev/null
      - |
        set -euo pipefail
        APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
        [ -f "$APK" ] || { echo "APK missing: $APK"; ls -la apps/android/app/build/outputs/apk/debug/ || true; exit 1; }
        HASH=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
        PKG=/api/packages/indexarr/generic/androidconnect-apk

        # Pull the shared Forgejo API wrapper from ops. Logs status + body on
        # errors instead of swallowing them with curl -sf — see
        # scripts/forgejo-api.sh in indexarr/ops for why this isn't inline curl.
        curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" \
          -o /usr/local/bin/forgejo-api \
          https://repo.indexarr.net/indexarr/ops/raw/branch/main/scripts/forgejo-api.sh
        chmod +x /usr/local/bin/forgejo-api
        export FORGEJO_TOKEN="$GIT_AUTH_TOKEN"

        # Forgejo generic packages are immutable: PUT to an existing slot
        # returns 409 "package file already exists". For the 'latest' slot we
        # delete-then-put so each build overwrites; the per-SHA slot should
        # never collide so we let it fail loud if it does.
        forgejo-api DELETE "$PKG/latest/androidconnect-debug.apk" --allow 404 >/dev/null
        forgejo-api PUT    "$PKG/latest/androidconnect-debug.apk" --upload "$APK" >/dev/null
        forgejo-api PUT    "$PKG/$HASH/androidconnect-debug.apk"  --upload "$APK" >/dev/null
        echo "APK published: latest + $HASH"
    when:
      - status: [success]

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**$CI_REPO** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**$CI_REPO** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
