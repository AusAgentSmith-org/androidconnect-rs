[workspace]
members = [
    "apps/desktop-viewer",
    "crates/android-native",
    "crates/protocol",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
androidconnect-protocol = { path = "crates/protocol" }
anyhow = "1.0.100"
bincode = "1.3.3"
jni = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
