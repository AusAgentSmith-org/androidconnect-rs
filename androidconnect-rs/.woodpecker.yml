when:
  - branch: main
    event: [push, pull_request]

clone:
  git:
    image: alpine/git
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git init
      - git remote add origin "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/androidconnect-rs.git"
      - git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
      - git checkout FETCH_HEAD

steps:
  - name: rust-checks
    image: rust:1.88
    commands:
      - cargo fmt --all -- --check
      - cargo clippy --workspace -- -D warnings
      - cargo test --workspace

  - name: android-build
    image: repo.indexarr.net/indexarr/androidconnect-rs-ci:latest
    commands:
      - ./tools/build-android-native.sh
      - cd apps/android && ./gradlew assembleDebug

  - name: publish-apk
    image: alpine/curl
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
        HASH=$(echo $CI_COMMIT_SHA | cut -c1-7)
        BASE="http://100.92.54.45:3002/api/packages/indexarr/generic/androidconnect-apk"
        curl -sf -T "$APK" -H "Authorization: token $FORGEJO_TOKEN" \
          "$BASE/latest/androidconnect-debug.apk"
        curl -sf -T "$APK" -H "Authorization: token $FORGEJO_TOKEN" \
          "$BASE/$HASH/androidconnect-debug.apk"
    when:
      - status: [success]

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**$CI_REPO** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**$CI_REPO** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
